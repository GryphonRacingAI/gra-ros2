# --- FastSLAM 2.0 Endurance Configuration: Real Car Starting Point ---
# This is a conservative starting point for real testing.
# Tune with logs; do not assume these values are final.

N: 1024
THREADS: 256
MAX_LANDMARKS: 800
SEED: 42
START_POSITION: [0.0, 0.0, 0.0]

# Options added for the sim (see sim_config.yaml), off here until measured on the car:
#  - REAR_AXLE_OFFSET: distance from the rear axle forward to base_link, if /odom is not already
#    the rear axle (the particles must hold the point that moves along the heading).
#  - sensor.FAR_RANGE / FAR_VARIANCE: a separate measurement covariance for far cones, if the
#    perception error grows with range (measure it against surveyed cones).
#  - NEW_LANDMARK_D2 (e.g. 9): charge a particle for starting a landmark; helped replays with
#    large process noise like the values below, unclear benefit with small noise.
# MEASURED in sim, 2026-11-09 (full trackdrive, ground truth, this file as-is via use_sim:=false, 2 runs):
# 10 laps are counted, but the map is bad (51 and 54 landmarks for 72 cones, 40-43 ghosts, alignment
# residual 1.6-1.8 m) and the car is > 1 m off the centreline 58-64 % of the time, > 2.55 m (half the
# track width) 14-25 %, max 5.6-6.2 m. With sim_config.yaml: map residual ~0.1 m, 0 % > 1.5 m off.
# The yaw-rate variance below is the cause (see above): measure it on the car before trusting this file.
# The CUDA kernel fixes in the vendored slam/slam/fastslam64/cuda/*.cu (EKF bearing residual, colour-aware association)
# apply here too. Measure CONTROL_VARIANCE from logged odometry vs a reference (per-update
# increments): the yaw-rate value below (0.1 rad/s sd) is far more than a calibrated gyro shows,
# and in sim this much noise still breaks mapping with 512-2048 particles.
CONTROL_VARIANCE:
  - 0.02      # Linear velocity variance; increase if wheel odom slips
  - 0.01      # Angular velocity variance; increase if yaw estimate drifts

THRESHOLD: 5.0

sensor:
  MAX_MEASUREMENTS: 60
  RANGE: 18.0
  MIN_RANGE: 1.0
  FOV: 1.22173
  LIDAR_X_OFFSET: 0.52

  # Real perception is noisier than sim.
  # Start wider, then tighten after measuring actual cone error.
  VARIANCE:
    - 0.09     # 0.30 m std dev
    - 0.004    # 0.063 rad = 3.6 deg std dev

endurance:
  ENABLED: true
  FREEZE_AFTER_LAPS: 1
  MIN_FREEZE_TIME: 10.0

  LOCALIZATION_THRESHOLD: 12.0
  LOCALIZATION_CONTROL_NOISE_MULTIPLIER: 4.0
  MAPPING_RESAMPLE_TRIGGER_RATIO: 0.3
  LOCALIZATION_RESAMPLE_TRIGGER_RATIO: 0.6

  LOCALIZATION_COVARIANCE:
    - 0.36     # 0.60 m std dev
    - 0.02     # 0.141 rad = 8.1 deg std dev