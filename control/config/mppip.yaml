mppi_controller:
  ros__parameters:
    # Frame contract: track_pathfinder publishes /path in velodyne (body-local).
    # use_local_frame=true → vehicle state is (0,0,0,v); odom pose is ignored.
    use_local_frame: true
    path_frame: velodyne
    path_topic: /path

    # MPPI Core Parameters
    dt: 0.05              # control period and model step (s)
    horizon: 30           # steps (1.5 s)
    num_rollouts: 400
    lambda: 2.0
    lambda_spread: 0.15   # temperature >= this x (median - best sample cost): keeps several samples in the average
    sigma_u: [1.5, 0.06]  # sampling noise std: accel (m/s^2), steering command (rad)
    alpha: 0.6            # time correlation of the sampling noise

    # Cost Weights
    w_path: 20.0          # (distance to path)^2
    w_heading: 4.0        # (heading error)^2
    w_speed: 1.0          # (v - v_ref)^2 below v_ref: rewards progress
    w_overspeed: 5.0      # (v - v_ref)^2 above v_ref
    w_progress: 10.0      # reward per metre of progress along the path over the horizon
    w_grip: 20.0          # lateral accel above 1.2 x a_lat_max (incl. unwinding steering at speed)
    w_steer_rate: 150.0   # (change of steering command)^2
    w_accel: 0.05
    w_obstacle: 300.0       # (clearance shortfall, m)^2 per footprint circle; see the footprint block below

    # Vehicle (ADS-DV; see simulation/src/ads_dv_vcu_sim.cpp)
    max_accel: 4.0        # VCU torque limit: ~4.7 m/s^2 at low speed, less above 8 m/s
    max_decel: 4.0        # motor braking (regen); the friction brakes are for stopping
    max_vel: 15.0
    v_creep: 1.5          # never plan below this: a stopped car can't steer back onto the path
    max_steer: 0.38       # effective: Gazebo's Ackermann inner-wheel limit clips 0.4242 to ~0.38 (measured R 3.85 m)
    steer_rate: 1.0       # steering actuator rate (rad/s)
    steer_tau: 0.15       # steering actuator lag (s)
    wheelbase: 1.534

    # Path Following
    path_spacing: 0.5     # path resampled every 0.5 m
    path_smoothing: 1.5   # m, half window of the moving average before curvature (waypoints jitter)
    cone_radius: 0.12     # cone base half-width (0.114)
    obstacle_window: 5.0  # m: only cones this close to the previous plan enter the cone cost (CPU)
    debug_costs: false
    # Car footprint (ADS-DV): the model point is the rear axle, base_link (centre, /odom) is rear_to_base ahead of it,
    # the path frame (velodyne) is base_to_path_frame further ahead. Cones are checked with circles along the car.
    rear_to_base: 0.767
    base_to_path_frame: 0.52
    circle_offsets: [-0.5, 0.0, 0.767, 1.534, 1.95]   # from the rear axle: tail, rear wheels, middle, front wheels, nose
    circle_radii: [0.35, 0.67, 0.40, 0.58, 0.30]      # cover the body (+-0.245) and the wheel edges (rear 0.668, front 0.57)
    obstacle_margin: 0.3    # clearance wanted beyond touching (m)
    w_collision: 0.0     # per step and circle that touches a cone
    speed_lead: 0.25      # speed request = planned speed this far ahead (s)
    path_timeout: 1.0     # no new /path for this long (s) and at the end of the last one: stop
    path_extension: 0.0   # m to extend the path straight ahead (acceleration only)

    # Speed Profile
    a_lat_max: 3.5        # planned lateral accel (tyres hold ~13 m/s^2; margin for path noise)
    v_max_straight: 10.0
    v_min: 2.0
    a_brake_plan: 3.0     # planned braking before slow sections
    a_accel_plan: 2.0     # planned acceleration out of slow sections (exit of the hairpin)
